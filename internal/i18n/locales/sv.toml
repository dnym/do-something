["help.log"]
other = "Registrera nedlagd tid och/eller kostnad: log <id|title> [time-passed] [--cost N]. Tid och kostnad kan registreras var för sig eller atomärt i samma anrop. Utelämnad tid hämtas från min_session_duration endast när --cost också saknas. Värden måste vara positiva och ändliga. Ändliga poster måste ha motsvarande återstående uppskattning; fortlöpande poster kan registrera kostnad utan cost_left. Återstående uppskattningar minskas som lägst till noll medan totalerna bevaras. Loggning tillåts endast för in_progress om inte --force anges; --force registrerar aktiviteten utan att i övrigt ändra status. Vid noll återstående tid frågar en terminal om en in_progress-post ska markeras som klar. Utan interaktion lämnas status oförändrad. --complete markerar den som klar vid noll; --no-complete förhindrar frågan. --complete kräver registrerad tid, är ogiltig för fortlöpande poster och kan inte slutföra klara eller avförda poster. Varje anrop registrerar en separat aktivitet, så upprepa inte ett anrop utan att kontrollera resultatet."

