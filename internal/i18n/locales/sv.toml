other = "--mode MODE omrankerar poster mot den valda aktivitetstypen (movement, hands_on, thinking, making); den excluderar aldrig poster — styrkan är vikten scoring.term.mode_match."

["help.filter.engagement"]
other = "--engagement ENGAGEMENT omrankerar poster mot den valda engagemangsstilen (focused, loose); den excluderar aldrig poster — styrkan är vikten scoring.term.engagement_match."

["help.topic.modes"]
other = "mode är den typ av aktivitet du känner för:\n  movement — rör på mig (promenad, gym, sport, dans)\n  hands_on — använd händerna (bygga, slöjd, pyssla, laga)\n  thinking — använd huvudet (studera, analysera, läsa, pussel)\n  making — skapa något (ett verk du försöker för in i världen: spelet, låten, fågelboet)\n\nGrenen för making: det räknas som making när sessionen tjänar en ofärdig artefakt du försöker för in i världen — även om den aldrig ska finnas utöver för dig, även om du river i bitar papperet efteråt. Att bearbeta trä i slöjdsalen \"bara för att\" är hands_on, inte making; ett fågelbo är hands_on + making; att koreografera en dans är making + movement.\n\nEn post kan ha flera moduler; en post utan moduler är oklassificerad. Tomt betyder okänt, inte \"passar allting\" — om en post verkligen passar flera typer, markera dem alla uttryckligen. Modulmängden är inbyggd (som kind och status); egna moduler är en v2-kandidat.\n\n--mode MODE (suggest, list) omrankerar poster mot den valda typen: en passande post lyfts, en post som passar andra typer sänks och en oklassificerad post hamnar emellan. Den excluderar aldrig poster. Styrkan är vikten scoring.term.mode_match (standard 2.0; sätt den till 0 för att stänga av).\n\nSätt moduler vid add/edit med --modes movement --modes hands_on (kommaseparerat fungerar också); --clear-modes tar bort dem. I interaktivt läge frågas du; \"clear\" tömmer mängden."

["help.topic.engagement"]
other = "engagement är hur du vill engagera dig i aktiviteten, oberoende av dess typ:\n  focused — lägg upp fullt fokus (absorberad, ouppdelad uppmärksamhet)\n  loose — håll det slapat (avslappnat, av och till, inte krävande)\n\nDet gäller alla typer, inte bara huvudarbete: fokuserat studerande eller slapp läsning; ett tekniskt träningspass eller en otressad promenad; att lära sig löda eller sticka ett bekant mönster; att komponera eller måla utan mål. Det är en preferens, inte en intensitetsreglage — hur krävande en aktivitet är betygas och filtreras av --effort istället.\n\nEn post kan bära båda (en krävande bok du studerar en fokuserad dag och läser en sakta kväll); en post utan engagemang är oklassificerad. Tomt betyder okänt, inte \"fungerar i alla engagemangsstilar\". Engagemangsmängden är inbyggd (som mode, kind och status); egna engagemang är en v2-kandidat.\n\n--engagement ENGAGEMENT (suggest, list) omrankerar poster mot den valda engagemangsstilen, exakt som --mode: träff lyfts, endast-andra sänks, oklassificerad hamnar emellan; den excluderar aldrig. Styrkan är vikten scoring.term.engagement_match (standard 2.0; sätt den till 0 för att stänga av). De två flaggorna är oberoende axlar och kombineras: --mode thinking --engagement focused = absorbera något krävande med huvudet.\n\nSätt engagement vid add/edit med --engagements focused --engagements loose (kommaseparerat fungerar också); --clear-engagements tar bort dem. I interaktivt läge frågas du; \"clear\" tömmer mängden."

