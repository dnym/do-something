["help.topic.intensity"]
other = "intensity är 0..1-betyget för hur krävande aktiviteten är i sig — den energi och uppmärksamhet den kräver medan du gör den (0 ingen … 1 intensiv). De sex kanoniska nivåerna namnger ankaretalen: none=0, low=1/3, medium=1/2, high=2/3, very_high=4/5, max=1.\n\nDet är en krävighetsdimension, inte en värde-dimension: intensity ingår aldrig i poängen — ingen poänggrupp och ingen just-nu-term läser den. Dess roll är --effort-filtret (se help effort): --effort LEVEL behåller poster med intensity på eller under nivåns tak (scoring.effort.<level>, standardvärdena ovan) — en post betygd high släpps igenom av --effort high men inte av --effort medium.\n\nDen avtar aldrig (scoring.half_life.intensity är oändlig som standard): hur krävande en aktivitet är åldras inte.\n\nSätt den med ett nivånamn eller ett tal i 0..1: do-something add --intensity high eller --intensity 0.3, på samma sätt edit <id|title> --intensity high; de interaktiva frågorna visar nivåerna och accepterar båda. --unset-rating intensity gör den okänd igen."

["help.topic.career"]
other = "career är project-ens 0..1-värde för din professionella utveckling och dina långsiktiga karriärmål: de färdigheter, det rykte och de möjligheter det bygger (0 inget … 1 utmärkt).\n\nDen hör till project-gruppen value (tillsammans med physical, mental, social); gruppen ingår i grundpoängen, vikta med scoring.group.value och egenskapvikten scoring.weights.project.career (eller sort-oberoende scoring.weights.career).\n\nBetyget avtar mot prior 0.5 med halveringstiden 36 månader (scoring.half_life.career): ett värde uppskattat för år sedan är mindre säkert än ett du just gav. Betyg utan datum (t.ex. importerade) avtar aldrig.\n\nSätt det med do-something add --career 0.5 eller edit <id|title> --career 0.5, eller interaktivt; --unset-rating career gör det okänt igen."

["help.topic.physical"]
other = "physical är project-ens 0..1-värde för din fysiska hälsa och kondition: hur det bidrar till en hälsosam livsstil, en bättre träningsnivå eller ett hälsomål (0 inget … 1 utmärkt).\n\nDen hör till project-gruppen value (tillsammans med career, mental, social); gruppen ingår i grundpoängen, vikta med scoring.group.value och egenskapvikten scoring.weights.project.physical (eller sort-oberoende scoring.weights.physical).\n\nBetyget avtar mot prior 0.5 med halveringstiden 36 månader (scoring.half_life.physical). Betyg utan datum (t.ex. importerade) avtar aldrig.\n\nSätt det med do-something add --physical 0.5 eller edit <id|title> --physical 0.5, eller interaktivt; --unset-rating physical gör det okänt igen."

["help.topic.mental"]
other = "mental är project-ens 0..1-värde för din mentala hälsa, kognitiva funktioner och emotionella välbefinnande: motståndskraft, minskad stress, meningsfullhet (0 inget … 1 utmärkt).\n\nDen hör till project-gruppen value (tillsammans med career, physical, social); gruppen ingår i grundpoängen, vikta med scoring.group.value och egenskapvikten scoring.weights.project.mental (eller sort-oberoende scoring.weights.mental).\n\nBetyget avtar mot prior 0.5 med halveringstiden 36 månader (scoring.half_life.mental). Betyg utan datum (t.ex. importerade) avtar aldrig.\n\nSätt det med do-something add --mental 0.5 eller edit <id|title> --mental 0.5, eller interaktivt; --unset-rating mental gör det okänt igen."

["help.topic.social"]
other = "social är project-ens 0..1-värde för dina relationer och samhälle: de interaktioner det innebär, de band det stärker, de andra det gynnar (0 inget … 1 utmärkt).\n\nDen hör till project-gruppen value (tillsammans med career, physical, mental); gruppen ingår i grundpoängen, vikta med scoring.group.value och egenskapvikten scoring.weights.project.social (eller sort-oberoende scoring.weights.social).\n\nBetyget avtar mot prior 0.5 med halveringstiden 36 månader (scoring.half_life.social). Betyg utan datum (t.ex. importerade) avtar aldrig.\n\nSätt det med do-something add --social 0.5 eller edit <id|title> --social 0.5, eller interaktivt; --unset-rating social gör det okänt igen."

["help.topic.interest"]
other = "interest är 0..1-betyget för hur mycket posten tilltalar dig (0 inget … 1 kan knappt vänta). Båda sorterna har den.\n\nDen har sin egen poänggrupp (interest) i båda sorterna: ju mer du vill göra posten, desto högre grundpoäng. Vikt: scoring.group.interest och egenskapvikten scoring.weights.<kind>.interest (eller sort-oberoende scoring.weights.interest).\n\nDet är det snabbast avtagande betyget — halveringstiden 18 månader (scoring.half_life.interest): ett betyg från i år säger lite om hur du känner dig idag. Att betyga interaktivt uppdaterar dess datum; betyg utan datum (t.ex. importerade) avtar aldrig.\n\nSätt den med do-something add --interest 0.8 eller edit <id|title> --interest 0.8, eller interaktivt; --unset-rating interest gör den okänd igen."

["help.topic.actuality"]
other = "actuality är media-postens 0..1-betyg för hur närvarande verket är i nutida media och debatt (0 inaktuellt … 1 högaktuellt).\n\nDen hör till media-gruppen value (tillsammans med quality och influence); gruppen ingår i grundpoängen, vikta med scoring.group.value och egenskapvikten scoring.weights.media.actuality (eller sort-oberoende scoring.weights.actuality).\n\nDen avtar snabbare än vilket annat betyg som helst — halveringstiden 12 månader (scoring.half_life.actuality): det som var aktuellt för ett år sedan är sällan det längre. (Quality och influence avtar i stället aldrig.)\n\nSätt den med do-something add --actuality 0.5 eller edit <id|title> --actuality 0.5, eller interaktivt; --unset-rating actuality gör den okänd igen."

["help.topic.influence"]
other = "influence är media-postens 0..1-betyg för hur mycket verket har format sin genre eller kultur (0 obetydligt … 1 kulturbärande referens).\n\nDen hör till media-gruppen value (tillsammans med quality och actuality); gruppen ingår i grundpoängen, vikta med scoring.group.value och egenskapvikten scoring.weights.media.influence (eller sort-oberoende scoring.weights.influence).\n\nDen avtar aldrig (scoring.half_life.influence är oändlig): ett referensverk förblir ett referensverk.\n\nSätt den med do-something add --influence 0.5 eller edit <id|title> --influence 0.5, eller interaktivt; --unset-rating influence gör den okänd igen."

["help.topic.quality"]
other = "quality är media-postens 0..1-betyg för hur bra verket är (0 dåligt eller okänt … 1 hyllat).\n\nDen hör till media-gruppen value (tillsammans med influence och actuality); gruppen ingår i grundpoängen, vikta med scoring.group.value och egenskapvikten scoring.weights.media.quality (eller sort-oberoende scoring.weights.quality).\n\nDen avtar aldrig (scoring.half_life.quality är oändlig): kvaliteten på ett verk åldras inte som dess aktualitet gör.\n\nSätt den med do-something add --quality 0.5 eller edit <id|title> --quality 0.5, eller interaktivt; --unset-rating quality gör den okänd igen."

["help.topic.remaining_duration"]
other = "remaining_duration är den uppskattade aktiva tid som behövs för att slutföra posten från dess nuvarande läge. Den gäller för både project och media. Lagring och JSON använder timmar; CLI-indata använder tidsangivelser som 30m eller 2h.\n\nDen ingår i commitment-gruppen för båda sorterna (tillsammans med cost_left för project) och poängsätts med k-kurvan d = k/(k+v). scoring.k.remaining_duration är som standard 20 timmar. Mindre återstående tid ger högre poäng för denna komponent. En serie på 40 timmar med 24 minuter kvar får cirka 0.98 i stället för 0.33 när inget har setts. Ingen extra bonus baseras på andelen som är klar.\n\nDen styr --finish-within DURATION och kolumnen för återstående tid i list/show. För project med deadline styr den även beräkningen av kravtakten mot scoring.k_pace (standard 2 h/dag).\n\nSätt den med do-something add --remaining-duration 40h eller edit <id|title> --remaining-duration 30m. Ändringar påverkar inte total_duration eller status; inte ens noll markerar posten som klar. --clear-remaining-duration gör värdet okänt. Ingen av tidsuppskattningarna härleds från den andra; enbart återstående tid räcker för poängsättning. Använd --ongoing för aktiviteter utan slutmål (se help ongoing)."

["help.topic.cost_left"]
other = "cost_left är den återstående direkta ekonomiska kostnaden för att slutföra posten, i den valutaenhet du använder (visningsetiketten är konfigurationsnyckeln scoring.cost_unit). Båda sorterna har den.\n\nDen gäller för båda sorterna, men standardsammansättningen räknar bara in den i commitment-gruppen för project (commitment-gruppen för media innehåller bara remaining_duration), så en kostnad sparad på en mediapost påverkar inte poängen förrän du lägger till den där: do-something config set scoring.group_members.commitment.media remaining_duration,cost_left. I en grupp poängsätts den på k-kurvan d = k/(k+v) — men scoring.k.cost_left levereras utan standardvärde. Innan du kalibrerar den i din egen valutaenhet (do-something config set scoring.k.cost_left 500) beter sig mätvärdet som okänt: det betygas med prior 0.5 även när ett värde är lagrat. En kostnad i nån annans enhet är meningslös, så produkten vägrar hitta på en.\n\nDen styr --budget N-filtret (cost_left ≤ N; okända släpps igenom med etikett).\n\nSätt den med do-something add --cost N eller edit <id|title> --cost N; --clear-cost gör den okänd."

["help.topic.min_session_duration"]
other = "min_session_duration är postens kortaste meningsfulla pass: ett kapitel, några övningar, ett avsnitt eller en tvåminutersfilm. Båda sorterna har värdet. Lagring och JSON använder timmar; CLI-indata använder tidsangivelser som 20m eller 1h.\n\nVärdet deltar inte i poängsättningen (ingen kurva är definierad). Filtret --session DURATION (alias --time) behåller poster vars minsta meningsfulla pass ryms i den tillgängliga tiden. Okända värden släpps igenom som standard och märks unknown.\n\nInga typspecifika värden levereras. Typspecifika standardvärden används när en post läggs till, om värdet inte uttryckligen rensas, och visas som förslag i frågorna. Konfigurera dem i timmar med do-something config set defaults.min_session_duration.custom 0.5.\n\nSätt värdet med do-something add --min-session-duration 30m eller edit <id|title> --min-session-duration 20m; --clear-min-session-duration gör det okänt."

["help.topic.total_duration"]
other = "total_duration är den uppskattade aktiva tiden för hela posten, för både project och media: ett projekts arbetsinsats, en films speltid, en boks lästid eller en series totala visningstid. Väntetid mellan passen räknas inte in. Lagring och JSON använder timmar; CLI-indata använder tidsangivelser som 30m eller 2h.\n\nDen används inte för poängsättning eller --finish-within; det gör remaining_duration. Totalen minskar inte när du gör framsteg, men kan revideras när uppskattningen eller omfattningen ändras.\n\nUppskattad andel klar är 100 * (1 - remaining_duration / total_duration). list/show visar estimated_progress_percent i JSON och en ungefärlig procentsats i text. Värdet är null och utelämnas i text när någon uppskattning är okänd, totalen är noll eller återstående tid överstiger totalen. Reviderade uppskattningar kan sänka procentsatsen. Status är oberoende.\n\nDen interaktiva frågan erbjuder fyra grova tidsuppskattningar via scoring.duration_anchors (standard 0.5 / 3 / 20 / 100 timmar), eller en uttrycklig tidsangivelse. Sätt värdet med do-something add --total-duration 40h eller edit <id|title> --total-duration 50h; --clear-total-duration gör det okänt. För en opåbörjad post anger du uttryckligen samma uppskattning som remaining_duration. Använd --ongoing för aktiviteter utan slutmål (se help ongoing)."

["help.topic.deadline"]
other = "deadline är sista dag (ÅÅÅÅ-MM-DD) posten fortfarande kan slutföras. Båda sorterna har den.\n\nDen styr urgency-termen i just nu. För project med känd remaining_duration följer brådska kravtackten (remaining_duration ÷ dagar kvar) mot scoring.k_pace (standard 2 h/dag). För media — och project utan timmeuppskattning — gäller i stället en dagsbaserad kurva: 1 − dagar kvar ÷ scoring.deadline_horizon_days (standard 30), neddämpad till 0 (ingen brådska) och takad till 1 (sen = maximal brådska).\n\nPoster utan deadline har ingen urgency-term — om du inte sätter scoring.no_deadline_horizon till ett positivt antal dagar, vilket gör att urgency utgår från att varje deadline-lös post är förfallen efter just så många dagar.\n\nSätt den med do-something add --deadline 2026-12-01 eller edit <id|title> --deadline 2026-12-01; --clear-deadline tar bort den."

["help.topic.dependencies"]
other = "dependencies kopplar ihop poster: en post listar de förutsättningar som måste vara klara innan den kan påbörjas.\n\nEtt beroende blockerar sin beroende: medan någon förutsättning inte är klar, är den beroende posten blockerad. suggest döljer blockerade poster (se dem med --include-unready); list, show och doctor visar blockerarna med blockerarens status. Endast done löser upp en blockering — en dropped eller öppen förutsättning blockerar fortfarande, eftersom en avbokad förutsättning inte är en fullbordad. Antingen öppna den igen eller upplös kanterna: do-something deps remove <id|title> <dependency-id|title>.\n\nGrafen påverkar poängen också: unblocking-termen i just nu belönar att slutföra en post som gör dess beroende redo. Cyklar avvisas (CYCLE).\n\nHantera kanter med do-something deps list|add|remove <id|title> [ref …], eller ersätt hela mängden med do-something edit <id|title> --depends-on ref-a,ref-b (kommaseparerat). Varje ref är ett fullt id, ett entydigt id-prefix eller en exakt (skiftlägeskänslig) titel; en tvetydig titel ger INVALID_ID som listar kandidaterna, och en titel som också är en befintlig posts id tolkas som id. Ett kommatecken i en titel undviker du med omvänt snedstreck (\\,)."

["help.topic.status"]
other = "status är postens livscykeltillstånd:\n  not_started — inte påbörjad\n  in_progress — påbörjad, inte slutförd\n  done — klar\n  dropped — avbokad; det finns ingen hård radering, avbokning är hur en post lämnar den aktiva listan\n\nÖvergångar är uttryckliga verb på ett eller flera id: do-something start <id|title …>, done, drop, reopen. start fungerar från alla status utom in_progress; done och drop från alla; reopen från alla utom not_started — de undantagna raderna är idempotenta tomgångar (nuvarande = mål ⇒ changed: false), så ett verb lyckas på vilken post som helst. En körning med flera id är en enda allt-eller-inget-transaction; en ändring skriver en händelse (started / completed / dropped — reopen skriver ingen) som påverkar poängsättningen, en tomgång skriver ingen.\n\nadd och edit sätter status direkt: do-something add --title '…' --kind media --status done, eller edit <id|title> --status in_progress. En statusändring skriver samma händelse som det matchande verbet (started / completed / dropped; not_started skriver ingen), så historik och poängsättning ser den precis som efter ett statuskommando. Det är den bekväma vägen för historiska poster: skapa dem i det läge de är i, utan ett efterföljande start/done/drop-steg.\n\nsuggest returnar endast not_started- och in_progress-poster; list visar alla status. Filtrera med --status.\n\nStatus påverkar poängen: in_progress-poster bär momentum-termen, done-poster låser upp sina beroende (unblocking-termen) och blockerade poster döljs från suggest."

["help.topic.effort"]
other = "effort är värdet --effort LEVEL (suggest, list): hur mycket energi du kan lägga just nu, uttryckt som ett tak på posternas intensity-betyg. De sex nivåerna, från minst till mest krävande:\n  none       behåller poster med intensity ≤ 0 (i princip ansträngningsfri)\n  low        behåller poster med intensity ≤ 1/3\n  medium     behåller poster med intensity ≤ 1/2\n  high       behåller poster med intensity ≤ 2/3\n  very_high  behåller poster med intensity ≤ 4/5\n  max        sätter inget tak: alla intensiteter släpps igenom\n\nTaken är konfiguration, en per nivå: scoring.effort.none … scoring.effort.max (standardvärdena är värdena ovan). Poster utan intensity släpps igenom och märks \"unknown\"; --unknown exclude är strikt.\n\nTill skillnad från --mode och --engagement (som omrankerar) är effort ett hårt filter: en post över taket är utanför resultatmängden. Se help intensity och help filters."

