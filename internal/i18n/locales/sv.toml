["prompt.vocabulary_empty"]
other = "Inget ordförråd för {{.topic}} ännu; sätt några med: do-something config set {{.key}} \"a,b,c\""

["help.topic.kind"]
other = "kind är vad en post är:\n  project — något du gör för nytta eller nödvändighet\n  media — något du konsumerar för avslappning, ro eller intresse\n\nkind sätts när posten läggs till; ändra senare med: do-something edit <id|title> --kind …\nsuggest rangordnar project som standard; --kind media / both väljer de andra sorterna; list visar alla sorter.\n\nVäntar du på ett beslut? Gör beslutet självt till ett project (\"besluta vad du ska göra med bilen\"): det betygas som vilket project som helst, och utfallet blir ett uppföljningsproject, kopplat med beroenden."

["help.topic.type"]
other = "type är formen på posten; fritext på alla sorter (en film, ett brädspel, ett skrivprojekt, ...).\n\nInga typer är inbyggda. Ordförrådet är ditt:\n  do-something config get vocabulary.types\n  do-something config set vocabulary.types \"film,game,anime\"\n\nOrdförrådet styr bara interaktiv add/edit; allt du skriver accepteras och nya termer kan läggas till."

["help.topic.category"]
other = "category är ämnet för posten; fritext på alla sorter (fantasy, programmering, hälsa, ...).\n\nInga kategorier är inbyggda. Ordförrådet är ditt:\n  do-something config get vocabulary.categories\n  do-something config set vocabulary.categories \"fantasy,science\"\n\nOrdförrådet styr bara interaktiv add/edit; allt du skriver accepteras och nya termer kan läggas till."

["help.topic.properties"]
other = "Betyg (0..1) per sort:\n  project — intensity, career, physical, mental, social, interest\n  media — intensity, actuality, influence, quality, interest\n\nMätvärden per sort:\n  project — remaining_duration, cost_left, min_session_duration, total_duration, deadline\n  media — remaining_duration, cost_left, min_session_duration, total_duration, deadline\n\nOkända värden rapporteras aldrig som nollor; poängsättningen behandlar dem med ett prior på 0.5 (scoring.prior).\n\nAlla egenskaper har sin egen sida: do-something help <property>. Använd --ongoing för aktiviteter utan slutmål (se help ongoing)."

["help.topic.scoring"]
other = "score = (1 - beta) * base + beta * right-now, beta standard 0.2 (scoring.beta)\n\nbase: postens värdegrupper, vikta och normaliserade:\n  project — value (career, physical, mental, social), commitment (remaining_duration, cost_left), interest\n  media — value (quality, influence, actuality), commitment (remaining_duration), interest\nOkända värden betygas med ett prior på 0.5 (scoring.prior). Commitment halveras vid k-konstanterna (scoring.k.*); grupp-, egenskaps- och termvikter är konfiguration (scoring.group.*, scoring.weights.*, scoring.term.*).\n\nright-now: urgency (deadline mot takt), momentum (påbörjad), unblocking (låser upp andra poster), mode_match (posten passar den valda --mode; finns bara om --mode anges), engagement_match (posten passar den valda --engagement; finns bara om --engagement anges) och cooldown (inte föreslagen nyligen), blandade efter sina vikter. Använd --ongoing för aktiviteter utan slutmål (se help ongoing)."

["help.topic.filters"]
other = "Filter kombineras med AND; varje flagga begränsar resultatmängden.\n  --kind project|media|both   --status not_started|in_progress|done|dropped\n  --type T  --category C  --tag T  --not-tag T  --text T\n  --effort LEVEL  --session DURATION  --finish-within DURATION\n  --budget N  --min-score 0..1  --unknown include|exclude\n  --limit N  --random  --peek  --explain  --fail-empty\n  --mode movement|hands_on|thinking|making  --engagement focused|loose\n\n--kind both (suggest och list) rangordnar project och media i en lista; suggest är --kind project som standard.\n--effort LEVEL är ett betygsnivånamn — none, low, medium, high, very_high, max — och behåller poster med intensity på eller under nivåns tak (se help effort).\n--mode och --engagement omrankerar poster mot den valda aktivitetstypen och engagemangsstilen (se help modes och help engagement); till skillnad från övriga filter excluderar de aldrig poster.\nPoster med okända värden släpps igenom och märks \"unknown\"; --unknown exclude är strikt."

