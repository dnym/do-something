["help.log"]
other = "Record time and/or cost: log <id|title> [time-passed] [--cost N]. Time and cost may be logged separately or atomically in one invocation. Omitted time uses min_session_duration only when --cost is also omitted. Values must be positive and finite. Finite items need the corresponding remaining estimate; ongoing items may log cost without cost_left. Remaining estimates are clamped to zero, while totals are preserved. Logging is allowed only for in_progress items unless --force is given; --force records activity without otherwise changing status. At zero remaining time, a terminal asks whether to mark an in_progress item done. Non-interactive use leaves status unchanged. --complete marks it done at zero; --no-complete suppresses the question. --complete requires logged time, is invalid for ongoing items, and cannot complete done or dropped items. Each invocation records a separate activity, so do not retry blindly."

