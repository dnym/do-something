["help.topic.kind"]
other = "kind is what an item is:\n  project — something you do for benefit or necessity\n  media — something you consume for relaxation, fun, or interest\n\nkind is set when the item is added; change it later with: do-something edit <id|title> --kind …\nsuggest ranks projects by default; --kind media / both selects the other kinds; list shows all kinds.\n\nNot sure what to do about something yet? Make the decision itself a project (\"decide what to do about the car\"): it scores like any other project, and its outcome becomes a follow-up project, linked by dependencies."

["help.topic.type"]
other = "type is the form of the item; free text on every kind (a film, a board game, a writing project, ...).\n\nNo types are built in. The vocabulary is yours:\n  do-something config get vocabulary.types\n  do-something config set vocabulary.types \"film,game,anime\"\n\nThe vocabulary only guides interactive add/edit; anything you type is accepted, and new terms can be added to it."

["help.topic.category"]
other = "category is the topic of the item; free text on every kind (fantasy, programming, health, ...).\n\nNo categories are built in. The vocabulary is yours:\n  do-something config get vocabulary.categories\n  do-something config set vocabulary.categories \"fantasy,science\"\n\nThe vocabulary only guides interactive add/edit; anything you type is accepted, and new terms can be added to it."

["help.topic.properties"]
other = "Ratings (0..1) by kind:\n  project — intensity, career, physical, mental, social, interest\n  media — intensity, actuality, influence, quality, interest\n\nMeasurements by kind:\n  project — remaining_duration, cost_left, min_session_duration, total_duration, deadline\n  media — remaining_duration, cost_left, min_session_duration, total_duration, deadline\n\nUnknown values are never reported as zeroes; scoring treats them with a 0.5 prior (scoring.prior).\n\nEvery property has its own page: do-something help <property>. Use --ongoing for activities with no finish line (see help ongoing)."

["help.topic.scoring"]
other = "score = (1 - beta) * base + beta * right-now, beta default 0.2 (scoring.beta)\n\nbase: the value groups of the item's kind, weighted and normalized:\n  project — value (career, physical, mental, social), commitment (remaining_duration, cost_left), interest\n  media — value (quality, influence, actuality), commitment (remaining_duration), interest\nUnknown values are scored with a 0.5 prior (scoring.prior). Commitment halves at the k constants (scoring.k.*); group, property, and term weights are config keys (scoring.group.*, scoring.weights.*, scoring.term.*).\n\nright-now: urgency (deadline versus pace), momentum (already in progress), unblocking (frees other items), mode_match (item fits the selected --mode; present only when --mode is given), engagement_match (item fits the selected --engagement; present only when --engagement is given), and cooldown (not suggested recently), blended by their weights. Use --ongoing for activities with no finish line (see help ongoing)."

["help.topic.filters"]
other = "Filters combine with AND; every flag narrows the result set.\n  --kind project|media|both   --status not_started|in_progress|done|dropped\n  --type T  --category C  --tag T  --not-tag T  --text T\n  --effort LEVEL  --session DURATION  --finish-within DURATION\n  --budget N  --min-score 0..1  --unknown include|exclude\n  --limit N  --random  --peek  --explain  --fail-empty\n  --mode movement|hands_on|thinking|making  --engagement focused|loose\n\n--kind both (suggest and list) ranks projects and media in one list; suggest defaults to --kind project.\n--effort LEVEL is a rating level — none, low, medium, high, very_high, max — and keeps items with intensity at or below the level's ceiling (see help effort).\n--mode and --engagement re-rank items toward the selected kind and engagement style (see help modes and help engagement); unlike the other filters they never exclude items.\nItems with unknown values pass and are labelled \"unknown\"; --unknown exclude is strict."

