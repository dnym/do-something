["help.filter.mode"]
other = "--mode MODE re-ranks items toward the selected activity kind (movement, hands_on, thinking, making); it never excludes items — the strength is the weight scoring.term.mode_match."

["help.filter.engagement"]
other = "--engagement ENGAGEMENT re-ranks items toward the selected engagement style (focused, loose); it never excludes items — the strength is the weight scoring.term.engagement_match."

["help.topic.modes"]
other = "mode is the kind of activity you feel like doing:\n  movement — move my body (walking, gym, sport, dance)\n  hands_on — use my hands (building, crafting, tinkering, fixing)\n  thinking — use my mind (study, analysis, reading, puzzles)\n  making — make something (a work you are bringing into the world: the game, the song, the birdhouse)\n\nThe making line: it counts as making when the session serves an unfinished artifact you are trying to bring into the world — even if it will only ever exist for you, even if you tear up the paper afterwards. Working wood in the shop just for the doing is hands_on, not making; a birdhouse is hands_on + making; choreographing a piece is making + movement.\n\nAn item may carry several modes; an item with no modes is unclassified. Empty means unknown, not \"suits everything\" — if an item genuinely suits several kinds, mark them all explicitly. The mode set is built in (like kind and status); custom modes are a v2 candidate.\n\n--mode MODE (suggest, list) re-ranks items toward the selected kind: a fitting item is lifted, an item that suits other kinds is demoted, an unclassified item lands in between. It never excludes items. The strength is the weight scoring.term.mode_match (default 2.0; set it to 0 to disable).\n\nSet modes on add/edit with --modes movement --modes hands_on (comma-separated also works); --clear-modes removes them. In interactive mode you are prompted; \"clear\" empties the set."

["help.topic.engagement"]
other = "engagement is how you want to engage with the activity, independent of its kind:\n  focused — give it your full attention (absorbed, undivided)\n  loose — keep it low-key (relaxed, intermittent, undemanding)\n\nIt applies to every kind, not only mind work: focused study or loose reading; a technical workout or an unhurried walk; learning to solder or knitting a familiar pattern; composing or goal-free doodling. It is a preference, not an intensity dial — how demanding an activity is gets rated and filtered by --effort instead.\n\nAn item may carry both (a dense book you study on a focused day and read on a slow evening); an item with no engagements is unclassified. Empty means unknown, not \"works at any engagement\". The engagement set is built in (like mode, kind and status); custom engagements are a v2 candidate.\n\n--engagement ENGAGEMENT (suggest, list) re-ranks items toward the selected engagement, exactly like --mode: fit is lifted, other-only is demoted, unclassified lands in between; it never excludes. The strength is the weight scoring.term.engagement_match (default 2.0; set it to 0 to disable). The two flags are independent axes and combine: --mode thinking --engagement focused = absorb something hard with my mind.\n\nSet engagements on add/edit with --engagements focused --engagements loose (comma-separated also works); --clear-engagements removes them. In interactive mode you are prompted; \"clear\" empties the set."

["output.why.mode_match"]
other = "fits the selected mode"

["output.why.mode_unclassified"]
other = "has no mode set"

["output.why.mode_mismatch"]
other = "outside the selected mode"

["output.why.engagement_match"]
other = "fits the selected engagement"

["output.why.engagement_unclassified"]
other = "has no engagement set"

["output.why.engagement_mismatch"]
other = "outside the selected engagement"

["help.topic.intensity"]
other = "intensity is the 0..1 rating of how demanding the activity is in itself — the energy and attention it takes while you do it (0 none … 1 intense). The six canonical levels name the anchor fractions: none=0, low=1/3, medium=1/2, high=2/3, very_high=4/5, max=1.\n\nIt is a demand dimension, not a value dimension: intensity never enters the score — no scoring group and no right-now term reads it. Its role is the --effort filter (see help effort): --effort LEVEL keeps items with intensity at or below the level's ceiling (scoring.effort.<level>, defaulting to the values above) — an item rated high passes --effort high but not --effort medium.\n\nIt never decays (scoring.half_life.intensity is infinite by default): how demanding an activity is does not age.\n\nSet it with a level name or a 0..1 number: do-something add --intensity high or --intensity 0.3, likewise edit <id|title> --intensity high; the interactive prompts show the levels and accept either. --unset-rating intensity makes it unknown again."

["help.topic.career"]
other = "career is the project's 0..1 value for your professional development and long-term career goals: the skills, reputation, and opportunities it builds (0 none … 1 excellent).\n\nIt belongs to the project value group (with physical, mental, social); the group feeds the base score, weighted by scoring.group.value and the property weight scoring.weights.project.career (or kind-agnostic scoring.weights.career).\n\nThe rating decays toward the 0.5 prior with a 36-month half-life (scoring.half_life.career): a value estimated years ago is less certain than one you just gave. Undated ratings (e.g. imported) never decay.\n\nSet it with do-something add --career 0.5 or edit <id|title> --career 0.5, or interactively; --unset-rating career makes it unknown again."

["help.topic.physical"]
other = "physical is the project's 0..1 value for your physical health and fitness: how it contributes to a healthy lifestyle, a better training level, or a health goal (0 none … 1 excellent).\n\nIt belongs to the project value group (with career, mental, social); the group feeds the base score, weighted by scoring.group.value and the property weight scoring.weights.project.physical (or kind-agnostic scoring.weights.physical).\n\nThe rating decays toward the 0.5 prior with a 36-month half-life (scoring.half_life.physical). Undated ratings (e.g. imported) never decay.\n\nSet it with do-something add --physical 0.5 or edit <id|title> --physical 0.5, or interactively; --unset-rating physical makes it unknown again."

["help.topic.mental"]
other = "mental is the project's 0..1 value for your mental health, cognitive function, and emotional well-being: resilience, stress reduction, meaning (0 none … 1 excellent).\n\nIt belongs to the project value group (with career, physical, social); the group feeds the base score, weighted by scoring.group.value and the property weight scoring.weights.project.mental (or kind-agnostic scoring.weights.mental).\n\nThe rating decays toward the 0.5 prior with a 36-month half-life (scoring.half_life.mental). Undated ratings (e.g. imported) never decay.\n\nSet it with do-something add --mental 0.5 or edit <id|title> --mental 0.5, or interactively; --unset-rating mental makes it unknown again."

["help.topic.social"]
other = "social is the project's 0..1 value for your relationships and community: the interactions it involves, the bonds it strengthens, the others it benefits (0 none … 1 excellent).\n\nIt belongs to the project value group (with career, physical, mental); the group feeds the base score, weighted by scoring.group.value and the property weight scoring.weights.project.social (or kind-agnostic scoring.weights.social).\n\nThe rating decays toward the 0.5 prior with a 36-month half-life (scoring.half_life.social). Undated ratings (e.g. imported) never decay.\n\nSet it with do-something add --social 0.5 or edit <id|title> --social 0.5, or interactively; --unset-rating social makes it unknown again."

["help.topic.interest"]
other = "interest is the 0..1 rating of how much the item appeals to you (0 none … 1 can't wait). Both kinds carry it.\n\nIt has its own scoring group (interest) in both kinds: the more you want the item, the higher its base score. Weight: scoring.group.interest and the property weight scoring.weights.<kind>.interest (or kind-agnostic scoring.weights.interest).\n\nIt is the fastest-decaying rating — an 18-month half-life (scoring.half_life.interest): a rating from a year ago says little about how you feel today. Rating it interactively refreshes its date; undated ratings (e.g. imported) never decay.\n\nSet it with do-something add --interest 0.8 or edit <id|title> --interest 0.8, or interactively; --unset-rating interest makes it unknown again."

["help.topic.actuality"]
other = "actuality is the media item's 0..1 rating of how present the work is in current media and debate (0 stale … 1 timely).\n\nIt belongs to the media value group (with quality and influence); the group feeds the base score, weighted by scoring.group.value and the property weight scoring.weights.media.actuality (or kind-agnostic scoring.weights.actuality).\n\nIt decays faster than any other rating — a 12-month half-life (scoring.half_life.actuality): what was timely a year ago rarely is now. (Quality and influence, by contrast, never decay.)\n\nSet it with do-something add --actuality 0.5 or edit <id|title> --actuality 0.5, or interactively; --unset-rating actuality makes it unknown again."

["help.topic.influence"]
other = "influence is the media item's 0..1 rating of how much the work has shaped its genre or culture (0 trivial … 1 culture-defining reference).\n\nIt belongs to the media value group (with quality and actuality); the group feeds the base score, weighted by scoring.group.value and the property weight scoring.weights.media.influence (or kind-agnostic scoring.weights.influence).\n\nIt never decays (scoring.half_life.influence is infinite): a reference work stays a reference work.\n\nSet it with do-something add --influence 0.5 or edit <id|title> --influence 0.5, or interactively; --unset-rating influence makes it unknown again."

["help.topic.quality"]
other = "quality is the media item's 0..1 rating of how good the work is (0 poor or unknown … 1 acclaimed).\n\nIt belongs to the media value group (with influence and actuality); the group feeds the base score, weighted by scoring.group.value and the property weight scoring.weights.media.quality (or kind-agnostic scoring.weights.quality).\n\nIt never decays (scoring.half_life.quality is infinite): the quality of a work does not age the way its timeliness does.\n\nSet it with do-something add --quality 0.5 or edit <id|title> --quality 0.5, or interactively; --unset-rating quality makes it unknown again."

["help.topic.remaining_duration"]
other = "remaining_duration is the estimated active time needed to finish an item from its current state. It applies to both project and media. Storage and JSON use hours; CLI input uses durations such as 30m or 2h.\n\nIt belongs to the commitment group for both kinds (alongside cost_left for projects), scored on the k half-saturation curve d = k/(k+v), with scoring.k.remaining_duration defaulting to 20 hours. Less time remaining means higher commitment desirability. A 40-hour series with 24 minutes left scores this component at about 0.98 rather than 0.33 when unwatched. There is no additional percentage-based completion bonus.\n\nIt drives --finish-within DURATION and the remaining-time column in list/show. For projects with a deadline, it also drives the urgency pace calculation against scoring.k_pace (default 2 h/day).\n\nSet it with do-something add --remaining-duration 40h or edit <id|title> --remaining-duration 30m. Updates do not change total_duration or status; even zero does not mark an item done. --clear-remaining-duration makes it unknown. Neither duration is inferred from the other; remaining time alone is enough for scoring. Use --ongoing for activities with no finish line (see help ongoing)."

["help.topic.cost_left"]
other = "cost_left is the remaining direct monetary cost of finishing the item, in whatever currency unit you use (the display label is the scoring.cost_unit config key). Both kinds carry it.\n\nIt applies to both kinds, but the default composition only lists it in the project commitment group (the media commitment group contains only remaining_duration), so a cost stored on a media item does not contribute to scoring until you add it there: do-something config set scoring.group_members.commitment.media remaining_duration,cost_left. In a group it is scored on the k curve d = k/(k+v) — but scoring.k.cost_left ships without a default. Until you calibrate it in your own currency unit (do-something config set scoring.k.cost_left 500), the measurement behaves like unknown: it is scored at the 0.5 prior even when a value is stored. A cost in someone else's unit is meaningless, so the product refuses to invent one.\n\nIt drives the --budget N filter (cost_left ≤ N; unknowns pass, labelled).\n\nSet it with do-something add --cost N or edit <id|title> --cost N; --clear-cost makes it unknown."

["help.topic.min_session_duration"]
other = "min_session_duration is the item's smallest worthwhile session: a chapter, a few exercises, one episode, or a two-minute short. Both kinds carry it. Storage and JSON use hours; CLI input uses durations such as 20m or 1h.\n\nIt takes no part in scoring (no curve is defined for it). The --session DURATION filter (alias --time) keeps items whose smallest worthwhile session fits the available time. Unknown values pass by default and are labelled unknown.\n\nNo per-type values ship. Per-type defaults apply on add unless explicitly cleared, and are shown as suggestions in prompts. Configure them in hours with do-something config set defaults.min_session_duration.custom 0.5.\n\nSet it with do-something add --min-session-duration 30m or edit <id|title> --min-session-duration 20m; --clear-min-session-duration makes it unknown."

["help.topic.total_duration"]
other = "total_duration is the estimated active time needed for the whole item, for both project and media: project effort, a film's running time, a book's reading time, or a series' total viewing time. It excludes time spent waiting between sessions. Storage and JSON use hours; CLI input uses durations such as 30m or 2h.\n\nIt does not participate in scoring or --finish-within; remaining_duration does. Total duration does not decrease as you make progress, but you can revise it when your estimate or scope changes.\n\nEstimated progress is 100 * (1 - remaining_duration / total_duration). list/show exposes estimated_progress_percent in JSON and an approximate percentage in text. It is null/omitted from text when either estimate is unknown, total is zero, or remaining exceeds total. Revising estimates can move progress backward. Status remains independent.\n\nThe interactive prompt offers four coarse duration estimates using scoring.duration_anchors (default 0.5 / 3 / 20 / 100 hours), or an explicit duration. Set it with do-something add --total-duration 40h or edit <id|title> --total-duration 50h; --clear-total-duration makes it unknown. For an unstarted item, explicitly set remaining_duration to the same estimate. Use --ongoing for activities with no finish line (see help ongoing)."

["help.topic.deadline"]
other = "deadline is the last day (YYYY-MM-DD) the item can still be completed. Both kinds carry it.\n\nIt drives the urgency right-now term. For projects with a known remaining_duration, urgency follows the required pace (remaining_duration ÷ days left) against scoring.k_pace (default 2 h/day). For media — and projects without an hours estimate — a day-based curve applies instead: 1 − days left ÷ scoring.deadline_horizon_days (default 30), floored at 0 (no urgency) and capped at 1 (overdue = maximum urgency).\n\nItems without a deadline have no urgency term — unless you set scoring.no_deadline_horizon to a positive number of days, which makes urgency assume every deadline-less item is due that many days out.\n\nSet it with do-something add --deadline 2026-12-01 or edit <id|title> --deadline 2026-12-01; --clear-deadline removes it."

["help.topic.dependencies"]
other = "dependencies link items: an item lists the prerequisites that must be finished before it can start.\n\nA dependency blocks its dependent: while any prerequisite is not done, the dependent is blocked. suggest hides blocked items (see them with --include-unready); list, show, and doctor surface the blockers, with the blocker's status. Only done clears a block — a dropped or open prerequisite keeps blocking, because an abandoned prerequisite is not a completed one. Either reopen it or dissolve the edge: do-something deps remove <id|title> <dependency-id|title>.\n\nThe graph also scores: the unblocking right-now term rewards finishing an item that makes its dependents ready. Cycles are rejected (CYCLE).\n\nManage edges with do-something deps list|add|remove <id|title> [ref …], or replace the full set with do-something edit <id|title> --depends-on ref-a,ref-b (comma-separated). Each ref is a full id, a unique id prefix, or an exact (case-sensitive) title; an ambiguous title fails with INVALID_ID listing its candidates, and a title that is also an existing item's id resolves as the id. A comma inside a title is escaped with a backslash (\\,)."

["help.topic.status"]
other = "status is the item's lifecycle state:\n  not_started — not started\n  in_progress — started, not finished\n  done — finished\n  dropped — retired; there is no hard delete, dropping is how an item leaves the active list\n\nTransitions are explicit verbs on one or many ids: do-something start <id|title …>, done, drop, reopen. start works from any status except in_progress; done and drop from any; reopen from any except not_started — the excluded rows are idempotent no-ops (current = target ⇒ changed: false), so a verb on any item succeeds. A multi-id run is one all-or-nothing transaction; a change writes an event (started / completed / dropped — reopen writes none) that feeds scoring, a no-op writes none.\n\nadd and edit set the status directly: do-something add --title '…' --kind media --status done, or edit <id|title> --status in_progress. A status change records the same event as the matching verb (started / completed / dropped; not_started records none), so history and scoring see it just like a status command would. This is the convenient path for historical items: create them in the state they are in, with no follow-up start/done/drop step.\n\nsuggest returns only not_started and in_progress items; list shows every status. Filter with --status.\n\nStatus feeds the score: in_progress items carry the momentum term, done items unblock their dependents (the unblocking term), and blocked items are hidden from suggest."

["help.topic.effort"]
other = "effort is the --effort LEVEL value (suggest, list): how much energy you can put in right now, expressed as a ceiling on the items' intensity rating. The six levels, least to most demanding:\n  none       keeps items with intensity ≤ 0 (essentially effortless)\n  low        keeps items with intensity ≤ 1/3\n  medium     keeps items with intensity ≤ 1/2\n  high       keeps items with intensity ≤ 2/3\n  very_high  keeps items with intensity ≤ 4/5\n  max        applies no limit: every intensity passes\n\nThe ceilings are config, one per level: scoring.effort.none … scoring.effort.max (defaults are the values above). Items without an intensity pass and are labelled \"unknown\"; --unknown exclude is strict.\n\nUnlike --mode and --engagement (which re-rank), effort is a hard filter: an item above the ceiling is out of the result set. See help intensity and help filters."

